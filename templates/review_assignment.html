<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Assignment - NSL Classroom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <div class="container">
        <h2>Review Assignment</h2>
        <a href="{{ url_for('my_assignments') }}" class="btn btn-secondary mb-3">← Back to Assignments</a>

        <div class="card p-4 mb-4">
            <h5>{{ assignment.title }}</h5>
            <p><strong>Description:</strong> {{ assignment.description or 'No description' }}</p>

            <p>
                <strong>Student Submitted File:</strong>
                <a href="{{ url_for('uploaded_file', filename=assignment.file_path) }}" target="_blank" class="btn btn-info btn-sm">
                    📥 Download File
                </a>
            </p>
        </div>

        <div class="card p-4">
            <h5>Lecturer Comment / Feedback</h5>
            <form method="POST">
                <textarea name="comment" class="form-control" rows="6" placeholder="Write your feedback here...">{{ assignment.comment or '' }}</textarea>
                <br>
                <button type="submit" class="btn btn-success">Save Comment</button>
            </form>
        </div>
    </div>
</body>
</html>
