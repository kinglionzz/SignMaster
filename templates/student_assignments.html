<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Assignments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <div class="container">
        <h2>My Submitted Assignments</h2>
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary mb-3">← Back to Dashboard</a>

        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Status</th>
                    <th>Lecturer Comment</th>
                </tr>
            </thead>
            <tbody>
                {% for ass in assignments %}
                <tr>
                    <td>{{ ass.title }}</td>
                    <td>
                        <span class="badge
                            {% if ass.status == 'Reviewed' %}bg-success{% else %}bg-warning{% endif %}">
                            {{ ass.status }}
                        </span>
                    </td>
                    <td>
                        {% if ass.comment %}
                            {{ ass.comment }}
                        {% else %}
                            <span class="text-muted">Waiting for feedback</span>
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
